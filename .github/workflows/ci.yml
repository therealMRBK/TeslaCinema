name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Server syntax
        run: node --check app/server.js
      - name: Shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck setup.sh
      - name: Compose files are valid
        run: |
          cp .env.example .env
          sed -i 's/^AUTH_PASSWORD=.*/AUTH_PASSWORD=ci-test-password/' .env
          docker compose config -q
          docker compose --profile caddy --profile cloudflared config -q
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config -q

  image:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t teslacinema:ci .
      - name: Start and test login
        run: |
          docker run -d --name tc --shm-size=1g -e AUTH_PASSWORD=ci-test-password -p 8195:3000 teslacinema:ci
          for i in $(seq 1 40); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' tc)" = healthy ] && break
            sleep 3
          done
          docker logs tc | tail -20
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8195/healthz)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8195/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u cinema:wrong localhost:8195/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u cinema:ci-test-password localhost:8195/)" = 200
      - name: Refuses to start without a password
        run: |
          docker run --rm teslacinema:ci node server.js 2>&1 | grep -q "AUTH_PASSWORD is not set"
